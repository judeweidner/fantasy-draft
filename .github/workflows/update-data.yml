name: Refresh fantasy rankings and news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_fantasy_data.py'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fantasy-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh rankings and news
        run: python scripts/update_fantasy_data.py

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain -- live-data.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live-data.js
            git commit -m "Refresh fantasy rankings and news"
            git pull --rebase origin main
            git push origin main
          else
            echo "No ranking-data changes to commit"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
