name: Refresh fantasy rankings and news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_fantasy_data.py'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh rankings and news
        run: python scripts/update_fantasy_data.py

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain -- live-data.js)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.js
          git commit -m "Refresh fantasy rankings and news"
          git push
